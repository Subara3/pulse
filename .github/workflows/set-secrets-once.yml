# 使い捨て：サーバーの /web/config/secrets.php に PULSE_STATS_KEY と PULSE_LOG_SALT を足す。
# 値は GitHub Secrets から入れ、ログには出さない。終わったらこのファイルは消す。
name: set secrets once
on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: secrets.php に足す
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          STATS_KEY: ${{ secrets.PULSE_STATS_KEY }}
          LOG_SALT: ${{ secrets.PULSE_LOG_SALT }}
        run: |
          set -eu
          sudo apt-get install -y lftp php-cli >/dev/null 2>&1
          cd "$RUNNER_TEMP"
          lftp -u "$FTP_USER","$FTP_PASS" -e "set ftp:ssl-allow yes; get /web/config/secrets.php -o secrets.php; quit" "$FTP_HOST"
          php -l secrets.php >/dev/null
          python3 - <<'EOF'
          import os, re
          p = "secrets.php"
          s = open(p, encoding="utf-8").read()
          if "PULSE_STATS_KEY" in s or "PULSE_LOG_SALT" in s:
              raise SystemExit("すでに設定されているので何もしない")
          add = ("\n// PULSE: 統計ページの合言葉と、アクセスログのIPハッシュ用の塩\n"
                 "define('PULSE_STATS_KEY', '%s');\n"
                 "define('PULSE_LOG_SALT', '%s');\n") % (os.environ["STATS_KEY"], os.environ["LOG_SALT"])
          m = re.search(r"\?>\s*$", s)
          s = s[:m.start()] + add + "?>\n" if m else s.rstrip() + "\n" + add
          open(p, "w", encoding="utf-8").write(s)
          print("追記した")
          EOF
          php -l secrets.php >/dev/null
          grep -c "PULSE_STATS_KEY" secrets.php
          lftp -u "$FTP_USER","$FTP_PASS" -e "set ftp:ssl-allow yes; put secrets.php -o /web/config/secrets.php; quit" "$FTP_HOST"
          rm -f secrets.php
