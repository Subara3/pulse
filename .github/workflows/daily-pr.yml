# daily/ ブランチが push されたら、検査を走らせて PR を作る（なければ）。
# 毎日の追加は main に直接入れず、PR で CodeRabbit のレビューと人の確認を通す。
name: Daily PR

on:
  push:
    branches: ['daily/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 検査
        run: |
          python scripts/check_policy.py
          python tests/test_build.py

  open-pr:
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: PR を作る
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          CHECK: ${{ needs.check.result }}
        run: |
          set -eu
          if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR はもうある"; exit 0
          fi
          title=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" -q '.commit.message' | head -1)
          body="毎日の自動追加（${BRANCH}）。検査（check_policy / test_build）: ${CHECK}"
          gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body "$body"
