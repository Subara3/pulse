# daily/ ブランチが push されたら、検査を走らせて PR を作り（なければ）、検査が通ったらそのままマージする。
# 検査に落ちた PR はマージせずに残し、Discord に知らせる。
# （2026-11-05〜11-19 は CodeRabbit のレビューと人の確認を通してからマージしていた。お試しが終わったので自動マージに戻した）
name: Daily PR

on:
  push:
    branches: ['daily/**']
  # Daily Sync が main を取り込んで push したあと、検査を走らせ直すために呼ぶ
  # （GITHUB_TOKEN での push では push のワークフローが起動しないため）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 検査
        run: |
          python scripts/check_policy.py
          python tests/test_build.py

  open-pr:
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: PR を作る
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          CHECK: ${{ needs.check.result }}
        run: |
          set -eu
          # Daily Sync から呼ばれたとき（workflow_dispatch）は検査だけ。PR は作らない
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "検査だけ（Daily Sync から）"; exit 0; fi
          if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR はもうある"; exit 0
          fi
          title=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" -q '.commit.message' | head -1)
          body="毎日の自動追加（${BRANCH}）。検査（check_policy / test_build）: ${CHECK}"
          url=$(gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body "$body")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

  # 検査が通ったら PR をマージする。GITHUB_TOKEN でのマージでは main の push のワークフローが起動しないので、
  # プレビュー動画・デプロイ・Daily Sync はここから呼ぶ。Daily Sync が衝突を解消して呼び直したとき（workflow_dispatch）もマージする。
  merge:
    needs: [check, open-pr]
    if: ${{ always() && needs.open-pr.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.merge.outputs.result }}
      number: ${{ steps.merge.outputs.number }}
    steps:
      - name: マージする
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          CHECK: ${{ needs.check.result }}
        run: |
          set -u
          R="$GITHUB_REPOSITORY"
          num=$(gh pr list -R "$R" --head "$BRANCH" --state open --json number -q '.[0].number')
          echo "number=$num" >> "$GITHUB_OUTPUT"
          if [ -z "$num" ]; then echo "result=nopr" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$CHECK" != "success" ]; then echo "result=check-failed" >> "$GITHUB_OUTPUT"; exit 0; fi
          # PR を作った直後はマージできるかの判定がまだ出ていないことがあるので、少し待ってやり直す
          for i in $(seq 1 12); do
            if gh pr merge "$num" -R "$R" --merge --delete-branch; then
              echo "result=merged" >> "$GITHUB_OUTPUT"
              gh workflow run generate-previews.yml -R "$R" --ref main
              gh workflow run deploy.yml -R "$R" --ref main
              gh workflow run daily-sync.yml -R "$R" --ref main
              exit 0
            fi
            sleep 10
          done
          echo "result=merge-failed" >> "$GITHUB_OUTPUT"

  # 結果を Discord に知らせる。Webhook の URL は Secrets の DISCORD_WEBHOOK_URL。未設定なら何もしない。
  notify:
    needs: merge
    if: ${{ always() && needs.merge.outputs.number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discord に知らせる
        env:
          GH_TOKEN: ${{ github.token }}
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUM: ${{ needs.merge.outputs.number }}
          RESULT: ${{ needs.merge.outputs.result }}
        run: |
          set -eu
          if [ -z "$HOOK" ]; then echo "DISCORD_WEBHOOK_URL が未設定"; exit 0; fi
          R="$GITHUB_REPOSITORY"
          case "$RESULT" in
            merged) head="PULSEに載せました" ;;
            check-failed) head="PULSEのPRが検査に落ちました。マージしていません" ;;
            *) head="PULSEのPRをマージできませんでした（衝突など）" ;;
          esac
          title=$(gh pr view "$NUM" -R "$R" --json title,additions,deletions -q '.title + "（+" + (.additions|tostring) + " / -" + (.deletions|tostring) + "）"')
          msg="${head}: ${title}
          PR: https://github.com/$R/pull/$NUM"
          jq -n --arg c "$msg" '{content:$c, allowed_mentions:{parse:[]}}' | curl -sf -H 'Content-Type: application/json' -d @- "$HOOK" >/dev/null
          echo "sent"
